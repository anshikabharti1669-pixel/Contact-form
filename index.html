
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #c5d3df;
        }

        h2 {
            text-align: center;
            color: #24527a;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 11px;
            margin-bottom: 18px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #24527a;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #24527a;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #173b59;
        }

        @media (max-width: 600px) {
            .container {
                margin: 15px auto;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Contact Us</h2>
        <p>Fill in the form to send us a message.</p>

        <form action="mailto:yourname@example.com"
              method="post"
              enctype="text/plain">

            <label for="name">Full Name</label>
            <input type="text" id="name" name="Name"
                   placeholder="Enter your name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="Email"
                   placeholder="Enter your email" required>

            <label for="subject">Subject</label>
            <input type="text" id="subject" name="Subject"
                   placeholder="Enter the subject" required>

            <label for="message">Message</label>
            <textarea id="message" name="Message"
                      placeholder="Write your message here..."
                      required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </div>

</body>
</html>
